<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Smart Budget</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="icon" href="icon.png" />

    <style>
      :root {
        --bg: #0b0d12;
        --card-bg: #151922;
        --card-border: #232936;
        --text-main: #ffffff;
        --text-muted: #8b94a5;
        --accent: #3b82f6;
        --c-needs: #38bdf8; /* 55% Основни */
        --c-guilt: #f472b6; /* 5% За кеф */
        --c-invest: #a78bfa; /* 10% Инвестиции/Кредит */
        --c-short: #fbbf24; /* 15% Краткосрочни цели */
        --c-long: #34d399; /* 15% Дългосрочно богатство */
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 24px 16px 50px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 480px;
      }

      /* Мото банер */
      .motto-box {
        text-align: center;
        padding: 12px 16px;
        margin-bottom: 18px;
        border-radius: 14px;
        background: linear-gradient(
          135deg,
          rgba(52, 211, 153, 0.12),
          rgba(59, 130, 246, 0.12)
        );
        border: 1px solid rgba(52, 211, 153, 0.25);
        font-size: 13px;
        font-weight: 600;
        font-style: italic;
        color: #a7f3d0;
        letter-spacing: 0.2px;
      }

      /* Навигация по месеци */
      .month-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 8px 12px;
        margin-bottom: 16px;
      }

      .month-btn {
        background: rgba(255, 255, 255, 0.06);
        border: none;
        color: var(--text-main);
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .month-btn:active {
        background: rgba(255, 255, 255, 0.15);
      }

      .month-label {
        font-size: 16px;
        font-weight: 700;
        text-transform: capitalize;
      }

      /* Общ приход (X) */
      .hero-card {
        background: linear-gradient(160deg, #1b2230, #131720);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        padding: 22px 20px;
        text-align: center;
        margin-bottom: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .hero-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .hero-total {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #ffffff;
        margin-bottom: 16px;
      }

      /* Визуална лента за разпределението */
      .split-bar {
        display: flex;
        height: 8px;
        border-radius: 99px;
        overflow: hidden;
        gap: 3px;
        background: rgba(255, 255, 255, 0.05);
      }

      /* Форма за добавяне на приход */
      .input-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 20px;
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }

      input {
        background: #0d1017;
        border: 1px solid var(--card-border);
        color: var(--text-main);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: var(--accent);
      }

      .input-amount {
        width: 42%;
        font-weight: 700;
      }

      .input-note {
        width: 58%;
      }

      .add-btn {
        width: 100%;
        background: linear-gradient(135deg, #2563eb, #10b981);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 13px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .add-btn:active {
        opacity: 0.9;
        transform: scale(0.99);
      }

      /* Списък с добавени приходи за месеца */
      .income-list {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .income-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 14px;
      }

      .income-item-left {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #d1d5db;
      }

      .income-item-right {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .del-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: none;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Секция с изчисленията */
      .section-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        margin: 0 0 12px 4px;
      }

      .bucket-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        transition: all 0.2s ease;
      }

      .bucket-card.done {
        opacity: 0.65;
        border-color: rgba(52, 211, 153, 0.4);
      }

      .bucket-left {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .bucket-header {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pct-pill {
        font-size: 11px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 6px;
        color: #0b0d12;
      }

      .bucket-title {
        font-size: 15px;
        font-weight: 700;
      }

      .bucket-desc {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.35;
      }

      .bucket-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        flex-shrink: 0;
      }

      .bucket-amount {
        font-size: 20px;
        font-weight: 800;
      }

      .check-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--card-border);
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .bucket-card.done .check-btn {
        background: rgba(52, 211, 153, 0.18);
        border-color: rgba(52, 211, 153, 0.4);
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="motto-box">
        „Set money aside today and let them grow for you overtime“
      </div>

      <!-- Избор на месец -->
      <div class="month-bar">
        <button class="month-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-label" id="monthLabel">Месец</div>
        <button class="month-btn" onclick="changeMonth(1)">›</button>
      </div>

      <!-- Общи месечни приходи (X) -->
      <div class="hero-card">
        <div class="hero-label">Месечни приходи (X)</div>
        <div class="hero-total" id="totalIncomeDisplay">€0.00</div>
        <div class="split-bar">
          <div style="width: 55%; background: var(--c-needs)"></div>
          <div style="width: 5%; background: var(--c-guilt)"></div>
          <div style="width: 10%; background: var(--c-invest)"></div>
          <div style="width: 15%; background: var(--c-short)"></div>
          <div style="width: 15%; background: var(--c-long)"></div>
        </div>
      </div>

      <!-- Добавяне на приход -->
      <div class="input-card">
        <div class="input-row">
          <input
            type="number"
            step="0.01"
            inputmode="decimal"
            id="amountInput"
            class="input-amount"
            placeholder="Сума (€)"
          />
          <input
            type="text"
            id="noteInput"
            class="input-note"
            placeholder="Източник (напр. Заплата)"
          />
        </div>
        <button class="add-btn" onclick="addIncome()">+ Добави приход</button>
        <div class="income-list" id="incomeList"></div>
      </div>

      <div class="section-title">Разпределение на бюджета</div>
      <div id="bucketsContainer"></div>
    </div>

    <script>
      const STORAGE_KEY = "smart_budget_vault_v1";

      const BUCKETS = [
        {
          id: "needs",
          pct: 0.55,
          pctText: "55%",
          color: "var(--c-needs)",
          title: "🏠 Основни разходи",
          desc: "Максимум за наем, храна, сметки и транспорт",
        },
        {
          id: "guilt",
          pct: 0.05,
          pctText: "5%",
          color: "var(--c-guilt)",
          title: "😎 Без угризения",
          desc: "Пари, които да харчиш без да ти е гадно",
        },
        {
          id: "invest",
          pct: 0.1,
          pctText: "10%",
          color: "var(--c-invest)",
          title: "💳 Инвестиране / Кредит",
          desc: "Погасяване на кредит или текущи инвестиции",
        },
        {
          id: "short",
          pct: 0.15,
          pctText: "15%",
          color: "var(--c-short)",
          title: "🎯 Краткосрочни цели",
          desc: "Спестявания за нова къща, кола, ваканция и др.",
        },
        {
          id: "long",
          pct: 0.15,
          pctText: "15%",
          color: "var(--c-long)",
          title: "🏛️ Дългосрочно богатство",
          desc: "Инвестиране за дълго време (Long-term wealth)",
        },
      ];

      let currentDate = new Date();
      currentDate.setDate(1);

      function getMonthKey(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, "0");
        return `${y}-${m}`;
      }

      function loadAllData() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
          return {};
        }
      }

      function saveAllData(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          alert("Грешка при запазване в паметта на браузъра.");
        }
      }

      function getMonthData() {
        const all = loadAllData();
        const key = getMonthKey(currentDate);
        if (!all[key]) {
          all[key] = { incomes: [], checked: {} };
        }
        return { all, key, current: all[key] };
      }

      function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        render();
      }

      function addIncome() {
        const amountEl = document.getElementById("amountInput");
        const noteEl = document.getElementById("noteInput");

        const amount = parseFloat(amountEl.value.replace(",", "."));
        if (isNaN(amount) || amount <= 0) {
          amountEl.focus();
          return;
        }

        const note = noteEl.value.trim() || "Месечен приход";
        const { all, key, current } = getMonthData();

        current.incomes.push({
          id: Date.now(),
          amount: amount,
          note: note,
        });

        all[key] = current;
        saveAllData(all);

        amountEl.value = "";
        noteEl.value = "";
        render();
      }

      function deleteIncome(id) {
        const { all, key, current } = getMonthData();
        current.incomes = current.incomes.filter((item) => item.id !== id);
        all[key] = current;
        saveAllData(all);
        render();
      }

      function toggleBucket(bucketId) {
        const { all, key, current } = getMonthData();
        current.checked[bucketId] = !current.checked[bucketId];
        all[key] = current;
        saveAllData(all);
        render();
      }

      function formatEuro(val) {
        return (
          "€" +
          val.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }

      function render() {
        // 1. Заглавие на месеца
        const monthText = currentDate.toLocaleDateString("bg-BG", {
          month: "long",
          year: "numeric",
        });
        document.getElementById("monthLabel").innerText = monthText;

        // 2. Данни за текущия месец
        const { current } = getMonthData();
        const totalX = current.incomes.reduce(
          (sum, item) => sum + item.amount,
          0,
        );

        document.getElementById("totalIncomeDisplay").innerText =
          formatEuro(totalX);

        // 3. Списък с въведени приходи
        const incomeListEl = document.getElementById("incomeList");
        incomeListEl.innerHTML = "";

        current.incomes.forEach((item) => {
          const row = document.createElement("div");
          row.className = "income-item";
          row.innerHTML = `
                <div class="income-item-left">
                    <span>💵</span>
                    <span>${item.note}</span>
                </div>
                <div class="income-item-right">
                    <span>${formatEuro(item.amount)}</span>
                    <button class="del-btn" onclick="deleteIncome(${item.id})" title="Изтрий">×</button>
                </div>
            `;
          incomeListEl.appendChild(row);
        });

        // 4. Изчисляване на 5-те категории
        const container = document.getElementById("bucketsContainer");
        container.innerHTML = "";

        BUCKETS.forEach((b) => {
          const value = totalX * b.pct;
          const isDone = !!current.checked[b.id];

          const card = document.createElement("div");
          card.className = `bucket-card ${isDone ? "done" : ""}`;
          card.innerHTML = `
                <div class="bucket-left">
                    <div class="bucket-header">
                        <span class="pct-pill" style="background: ${b.color};">${b.pctText}</span>
                        <span class="bucket-title">${b.title}</span>
                    </div>
                    <div class="bucket-desc">${b.desc}</div>
                </div>
                <div class="bucket-right">
                    <div class="bucket-amount" style="color: ${b.color};">${formatEuro(value)}</div>
                    <button class="check-btn" onclick="toggleBucket('${b.id}')">
                        ${isDone ? "✓ Заделени" : "Отбележи"}
                    </button>
                </div>
            `;
          container.appendChild(card);
        });
      }

      // Позволява добавяне с бутон Enter
      document
        .getElementById("amountInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") addIncome();
        });
      document.getElementById("noteInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") addIncome();
      });

      render();
    </script>
  </body>
</html>
